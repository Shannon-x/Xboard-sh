; Defence in depth from the php.net advisory of 2026-10-21 (CVE-2026-109618 / CVE-2026-109619).
; The real fix is PHP >= 8.2.35 (enforced by PHP_MIN_VERSION in the Dockerfile); this only closes
; the confirmed session upload-progress path of CVE-2026-109619, which Xboard never uses.
; Must apply before request parsing, hence php.ini-level and not ini_set().
session.upload_progress.enabled = 0
