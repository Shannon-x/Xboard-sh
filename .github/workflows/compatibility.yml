name: Compatibility gate

on:
  pull_request:
  push:
    branches: [dev]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, bcmath, pdo_sqlite, redis
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  mysql-upgrade:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: compatibility-local-only
          MYSQL_DATABASE: xboard_compat
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: xboard_compat
      DB_USERNAME: root
      DB_PASSWORD: compatibility-local-only
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, bcmath, pdo_mysql, pdo_sqlite, redis
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  production-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the actual pinned PHP 8.2 Swoole image from this checkout
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t xboard-compatibility .
      - name: Validate production dependencies and legacy HTTP contracts
        run: |
          docker run --rm --entrypoint composer xboard-compatibility check-platform-reqs --no-dev
          docker run --rm --entrypoint php xboard-compatibility scripts/assert-api-contract.php
