name: Mail relay (Rust)

on:
  pull_request:
    paths: ["mail-relay/**", ".github/workflows/mail-relay.yml"]
  push:
    branches: ["master"]
    paths: ["mail-relay/**", ".github/workflows/mail-relay.yml"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mail-relay
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mail-relay
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - id: image
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ github.repository_owner }}/xboard-mail-relay' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 先构建到本地跑一下冒烟：镜像里的必须是真程序（连不上 Redis 要打出启动日志并以非 0 退出），PR 上也跑
      - uses: docker/build-push-action@v7
        with:
          context: mail-relay
          platforms: linux/amd64
          load: true
          tags: xboard-mail-relay:smoke
          cache-from: type=gha,scope=mail-relay
          provenance: false
      - name: Smoke test the image
        run: |
          set +e
          out=$(docker run --rm -e RELAY_REDIS_URL=redis://127.0.0.1:1/0 xboard-mail-relay:smoke 2>&1)
          code=$?
          set -e
          echo "$out" | head -5
          echo "exit=$code"
          test "$code" -ne 0
          echo "$out" | grep -q "mail-relay .* 启动"
      - uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        with:
          context: mail-relay
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=mail-relay
          cache-to: type=gha,scope=mail-relay,mode=max
          provenance: false
