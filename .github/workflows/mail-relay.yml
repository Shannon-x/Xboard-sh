name: Mail relay (Rust)

on:
  pull_request:
    paths: ["mail-relay/**", ".github/workflows/mail-relay.yml"]
  push:
    branches: ["master"]
    paths: ["mail-relay/**", ".github/workflows/mail-relay.yml"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mail-relay
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mail-relay
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - id: image
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ github.repository_owner }}/xboard-mail-relay' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: mail-relay
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=mail-relay
          cache-to: type=gha,scope=mail-relay,mode=max
          provenance: false
