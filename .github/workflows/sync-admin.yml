name: Sync Admin Frontend

on:
  repository_dispatch:
    types: [admin-updated]
  workflow_dispatch:

permissions:
  contents: write

# 两次 dispatch 并发跑会互相抢 master，串行排队即可
concurrency:
  group: sync-admin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Xboard-sh
        uses: actions/checkout@v6
        with:
          ref: master
          token: ${{ secrets.DISPATCH_TOKEN }}
          # 完整历史，否则构建后的 rebase 在浅克隆上会失败
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Build Admin Frontend
        run: |
          git clone --depth 1 https://github.com/Shannon-x/XBoard-admin.git /tmp/admin
          cd /tmp/admin
          bash $GITHUB_WORKSPACE/scripts/patch-admin.sh
          npm install
          npm run build
          rm -rf $GITHUB_WORKSPACE/public/assets/admin
          cp -r dist/ $GITHUB_WORKSPACE/public/assets/admin/

      - name: Check for changes
        id: changes
        run: |
          git add -f public/assets/admin/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/assets/admin/
          git commit -m "chore: sync admin frontend assets [auto]"
          # 构建耗时期间远端可能已前进（例如前后端接连推送），
          # 不先变基会直接 non-fast-forward 被拒、整次同步作废
          git pull --rebase origin master
          git push
