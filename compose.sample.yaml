services:
  web:
    image: ghcr.io/cedar2025/xboard:new
    volumes:
      - redis-data:/data
      - ./:/www/
    environment:
      - docker=true
    depends_on:
      - redis
    network_mode: host
    command: php artisan octane:start --port=7001 --host=0.0.0.0
    restart: always
  horizon:
    image: ghcr.io/cedar2025/xboard:new
    volumes:
      - redis-data:/data
      - ./:/www/
    restart: always
    network_mode: host
    command: php artisan horizon
    depends_on:
      - redis
  # 定时任务：单独一个容器跑（退款回查封号、付款核验、流量重置、佣金结算、每日邮件都靠它）。
  # web 里的看门狗只在它没心跳时临时代跑并告警；可设 SCHEDULER_HEARTBEAT_URL 接 Uptime Kuma Push 监控。
  scheduler:
    image: ghcr.io/cedar2025/xboard:new
    volumes:
      - redis-data:/data
      - ./:/www/
    restart: always
    network_mode: host
    command: php artisan schedule:work
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "php", "artisan", "scheduler:health", "--max-age=180"]
      interval: 60s
      timeout: 20s
      start_period: 120s
      retries: 3
    depends_on:
      - redis
  ws-server:
    image: ghcr.io/cedar2025/xboard:new
    volumes:
      - redis-data:/data
      - ./:/www/
    restart: always
    network_mode: host
    command: php artisan ws-server start
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    # 开 AOF（appendfsync everysec）：只用 RDB 时重启会丢最近几分钟入队的任务（流量上报、补开通、邮件、告警）。
    # 不要直接把 --appendonly yes 加到 redis-server 上重启已有数据的实例：没有 AOF 文件时 Redis 会以空库启动。
    # 这个脚本第一次先按 dump.rdb 加载、再在线开启 AOF，之后直接从 AOF 启动（见 docs/queue-and-scheduler.md）。
    command: ["sh", "/usr/local/bin/xboard-redis-start"]
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - redis-data:/data
      - ./.docker/usr/local/bin/xboard-redis-start:/usr/local/bin/xboard-redis-start:ro
    sysctls:
      net.core.somaxconn: 1024

volumes:
  redis-data:
