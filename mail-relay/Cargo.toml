[package]
name = "xboard-mail-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
async-channel = "2.5.0"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "pool", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring", "builder"] }
redis = { version = "1.8.3", features = ["tokio-comp", "streams", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
