# Clash Mi 专用精简模板（UA 形如 "ClashMeta/1.19.32; mihomo/1.19.32"）
#
# iOS 只给 VPN 扩展约 50MB 内存，完整 clashmeta 模板（29 个分组、10 个自动测速组、21 个规则集、
# 嗅探、fake-ip-filter 带 geosite:cn）在 mihomo 里要占 110MB 以上，Clash Mi 一连就被系统杀掉。
# 这份模板保留同名的主要分组和分流去向，去掉规则集、嗅探和不必要的自动测速组：
#   · 规则全部内联，国内靠 DOMAIN-SUFFIX,cn + GEOIP,CN 直连；
#   · 自动测速组只留三个且都是 lazy（用到才测）；
#   · 谷歌走代理、苹果和微软默认直连，和完整模板一致；没有广告拦截，测速地址不会被拦。
# 分组成员的写法（正则、'/(?!)/' 占位）和完整模板相同，由 ClashMeta::handle() 填节点。
mixed-port: 7890
allow-lan: false
mode: rule
ipv6: true
log-level: warning
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
keep-alive-interval: 30
profile:
  store-selected: true
  store-fake-ip: false
geo-auto-update: false
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb
hosts:
  dns.alidns.com: [223.5.5.5, 223.6.6.6]
  doh.pub: [1.12.12.12, 120.53.53.53]
sniffer:
  enable: false
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '*.test'
    - '+.msftncsi.com'
    - '+.msftconnecttest.com'
    - 'localhost.ptlogin2.qq.com'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - 'lens.l.google.com'
    - '*.srv.nintendo.net'
    - '+.stun.playstation.net'
    - 'xbox.*.*.microsoft.com'
    - '*.*.xboxlive.com'
    - '+.push.apple.com'
    - '+.cn'

proxies:

proxy-groups:
  - name: $app_name
    type: select
    proxies:
      - 自动选择
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
      - 🇸🇬 新加坡节点
      - 🇰🇷 韩国节点
      - 🌍 其他地区
      - DIRECT
  - name: 自动选择
    type: url-test
    lazy: true
    url: http://www.gstatic.com/generate_204
    interval: 600
    timeout: 12000
    tolerance: 150
    proxies:
      - REJECT
      - '/^(?!.*(官网|发布页|防失联|测试|勿连|不可直连|用中转|自行切换|剩余流量|套餐到期|距离下次重置|过滤掉|5x|6x|7x|10x))(?!^中转[|]尼日利亚家宽🇳🇬$)(?!^美国AT&T家宽无限流量🇺🇸vless$).+/iu'
  - name: 🇭🇰 香港节点
    type: select
    proxies:
      - 自动选择
      - '/^(?!.*(官网|发布页|防失联|测试|勿连|不可直连|用中转|自行切换|剩余流量|套餐到期|距离下次重置))(?=.*(香港|HK|🇭🇰)).+/iu'
  - name: 🇹🇼 台湾节点
    type: select
    proxies:
      - 自动选择
      - '/^(?!.*(官网|发布页|防失联|测试|勿连|不可直连|用中转|自行切换|剩余流量|套餐到期|距离下次重置))(?=.*(台湾|🇹🇼)).+/iu'
  - name: 🇯🇵 日本节点
    type: select
    proxies:
      - 自动选择
      - '/^(?!.*(官网|发布页|防失联|测试|勿连|不可直连|用中转|自行切换|剩余流量|套餐到期|距离下次重置))(?!^【3x】中转[|]日本NTT家宽$)(?!^【3x】中转[|]日本sony家宽$)(?!^【3x】中转[|]日本softbank家宽$)(?!^【6x】透传专线[|]日本NTT家宽$)(?!^【6x】透传专线[|]日本sony家宽$)(?!^【6x】透传专线[|]日本softbank家宽$)(?!^cf加速[|]日本动态家宽🇯🇵$)(?!^cf加速[|]日本KDDI家宽🇯🇵$)(?!^cf加速[|]日本softbank家宽🇯🇵$)(?=.*(日本|🇯🇵)).+/iu'
  - name: 🇺🇸 美国节点
    type: select
    proxies:
      - 自动选择
      - '/^(?!.*(官网|发布页|防失联|测试|勿连|不可直连|用中转|自行切换|剩余流量|套餐到期|距离下次重置))(?=.*(美国|🇺🇸|frontier)).+/iu'
  - name: 🇸🇬 新加坡节点
    type: select
    proxies:
      - 自动选择
      - '/^(?!.*(官网|发布页|防失联|测试|勿连|不可直连|用中转|自行切换|剩余流量|套餐到期|距离下次重置))(?=.*(新加坡|狮城|🇸🇬)).+/iu'
  - name: 🇰🇷 韩国节点
    type: select
    proxies:
      - 自动选择
      - '/^(?!.*(官网|发布页|防失联|测试|勿连|不可直连|用中转|自行切换|剩余流量|套餐到期|距离下次重置))(?=.*(韩国|🇰🇷)).+/iu'
  - name: 🌍 其他地区
    type: select
    proxies:
      - 自动选择
      - '/^(?!.*(官网|发布页|防失联|测试|勿连|不可直连|用中转|自行切换|剩余流量|套餐到期|距离下次重置))(?!.*(香港|HK|🇭🇰|台湾|🇹🇼|日本|🇯🇵|美国|🇺🇸|frontier|新加坡|狮城|🇸🇬|韩国|🇰🇷)).+/iu'
  - name: 🧠 AI自动
    type: url-test
    hidden: true
    lazy: true
    url: http://www.gstatic.com/generate_204
    interval: 600
    timeout: 12000
    tolerance: 150
    proxies:
      - REJECT
      - '/^(?!.*(官网|发布页|防失联|测试|勿连|不可直连|用中转|自行切换|剩余流量|套餐到期|距离下次重置))(?!.*(香港|🇭🇰))(?!^【3x】中转[|]日本NTT家宽$)(?!^【3x】中转[|]日本sony家宽$)(?!^【3x】中转[|]日本softbank家宽$)(?!^【6x】透传专线[|]日本NTT家宽$)(?!^【6x】透传专线[|]日本sony家宽$)(?!^【6x】透传专线[|]日本softbank家宽$)(?!.*(5x|6x|7x|10x))(?:(?=.*中转)(?=.*(日本|台湾|🇯🇵|🇹🇼))).+/iu'
  - name: 🤖 AI服务
    type: select
    proxies:
      - 🧠 AI自动
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - $app_name
      - 自动选择
      - 🇹🇼 台湾节点
      - 🇸🇬 新加坡节点
      - '/^(?!.*(官网|发布页|防失联|测试|勿连|不可直连|用中转|自行切换|剩余流量|套餐到期|距离下次重置))(?!.*(香港|🇭🇰))(?!^【3x】中转[|]日本NTT家宽$)(?!^【3x】中转[|]日本sony家宽$)(?!^【3x】中转[|]日本softbank家宽$)(?!^【6x】透传专线[|]日本NTT家宽$)(?!^【6x】透传专线[|]日本sony家宽$)(?!^【6x】透传专线[|]日本softbank家宽$)(?:(?=.*10x)|(?=.*中转)(?=.*(日本|台湾|🇯🇵|🇹🇼))).+/iu'
  - name: 📲 电报消息
    type: select
    proxies:
      - '/(?!)/'
      - $app_name
      - 自动选择
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
      - 🇸🇬 新加坡节点
  - name: 📹 油管视频
    type: select
    proxies:
      - '/(?!)/'
      - 🇯🇵 日本节点
      - $app_name
      - 🇭🇰 香港节点
      - 自动选择
      - 🇹🇼 台湾节点
      - 🇺🇸 美国节点
      - 🇸🇬 新加坡节点
  - name: 🎬 解锁节点
    type: url-test
    hidden: true
    lazy: true
    url: http://www.gstatic.com/generate_204
    interval: 600
    timeout: 12000
    tolerance: 150
    proxies:
      - REJECT
      - '/^(?!.*(官网|发布页|防失联|测试|勿连|不可直连|用中转|自行切换|剩余流量|套餐到期|距离下次重置|过滤掉|5x|6x|7x|10x))(?=.*(新加坡0[12]|日本樱花(?!10gbps)|独享webarena$|[|]台湾(🇹🇼)?$|美国一|美国二|美国洛杉矶|KDDI|biglobe|日本星链)).+/iu'
  - name: 🎥 流媒体
    type: select
    proxies:
      - '/(?!)/'
      - 🎬 解锁节点
      - 🇯🇵 日本节点
      - $app_name
      - 自动选择
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇺🇸 美国节点
      - 🇸🇬 新加坡节点
  - name: 📢 谷歌服务
    type: select
    proxies:
      - '/(?!)/'
      - 🇯🇵 日本节点
      - $app_name
      - 自动选择
      - DIRECT
      - 🇺🇸 美国节点
  - name: 🍎 苹果服务
    type: select
    proxies:
      - '/(?!)/'
      - DIRECT
      - $app_name
      - 🇺🇸 美国节点
  - name: Ⓜ️ 微软服务
    type: select
    proxies:
      - '/(?!)/'
      - DIRECT
      - $app_name
      - 🇺🇸 美国节点
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - '/(?!)/'
      - $app_name
      - 自动选择
      - DIRECT

