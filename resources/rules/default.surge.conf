#!MANAGED-CONFIG $subs_link interval=43200 strict=true
# Surge 的规则配置手册: https://manual.nssurge.com/
# 规则数据源: https://github.com/Loyalsoldier/surge-rules （每日自动构建更新）
# AI / 电报 / 流媒体规则: https://github.com/SukkaW/Surge （ruleset.skk.moe）

[General]
loglevel = notify
doh-server = https://doh.pub/dns-query
dns-server = 223.5.5.5, 119.29.29.29
tun-excluded-routes = 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.88.99.0/24, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32
skip-proxy = localhost, *.local, injections.adguard.org, local.adguard.org, captive.apple.com, guzzoni.apple.com, 0.0.0.0/8, 10.0.0.0/8, 17.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.88.99.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32

wifi-assist = true
# 局域网共享默认关闭；如需在电脑/电视上借用本机代理，请自行改为 true
allow-wifi-access = false
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
http-listen = 127.0.0.1:6152
socks5-listen = 127.0.0.1:6153

replica = false

tls-provider = openssl
network-framework = false
exclude-simple-hostnames = true
ipv6 = true

test-timeout = 12
proxy-test-url = http://www.gstatic.com/generate_204
geoip-maxmind-url = https://testingcf.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country.mmdb

[Replica]
hide-apple-request = true
hide-crashlytics-request = true
use-keyword-filter = false
hide-udp = false

[Panel]
SubscribeInfo = $subscribe_info, style=info

[Proxy]
$proxies

[Proxy Group]
# 由面板按节点名生成（app/Support/SurgePolicyGroups.php），结构参考 Surge 官方知识库和 TutuBetterRules / ACL4SSR：
#   Proxy（主选择）→ 自动选择 / 故障转移 / 各地区 / 3x 中转 / 6x 专线 / 10x 三网优化 / cf加速 / DIRECT
#   每个地区组和线路组里第一个是该组的自动优选（Surge 6 用 smart，旧版用 url-test，列表里隐藏），后面是可手动选的节点
#   自动类的组不含 cf 加速和 5x/6x/7x/10x 高倍率节点
#   🤖 AI服务 默认 🤖 AI优选（日本/台湾中转 → 日本 → 美国 → 台湾 → 新加坡，依次兜底）
#   📲 电报消息、🎞️ 国际流媒体（默认 🎬 解锁节点）、🐟 漏网之鱼（未命中规则的流量，可改直连）
# 规则只引用 Proxy、🤖 AI服务、📲 电报消息、🎞️ 国际流媒体、🐟 漏网之鱼，这几个组一定会生成；其余组没有节点时整组不发
$proxy_groups

[Rule]
# 自有域名分流（防失联 + 代理加速）
DOMAIN-SUFFIX,sufe.uk,DIRECT
DOMAIN-SUFFIX,sufe.us,Proxy
DOMAIN-SUFFIX,sufe.pro,Proxy

# 自定义规则
## 您可以在此处插入自定义规则

# 强制订阅域名直连
DOMAIN,$subs_domain,DIRECT

# Google 中国服务
DOMAIN-SUFFIX,services.googleapis.cn,Proxy
DOMAIN-SUFFIX,xn--ngstr-lra8j.com,Proxy

# AI 服务：SukkaW/Surge 的 AI 规则集（ruleset.skk.moe，按日更新），下面再补几条它可能没收的域名。
# 放在 google/proxy 规则集前面才能生效（gemini 等域名也在 google 集里）
RULE-SET,https://ruleset.skk.moe/List/non_ip/ai.conf,🤖 AI服务
DOMAIN-SUFFIX,openai.com,🤖 AI服务
DOMAIN-SUFFIX,chatgpt.com,🤖 AI服务
DOMAIN-SUFFIX,oaistatic.com,🤖 AI服务
DOMAIN-SUFFIX,oaiusercontent.com,🤖 AI服务
DOMAIN-SUFFIX,sora.com,🤖 AI服务
DOMAIN,openai-api.arkoselabs.com,🤖 AI服务
DOMAIN,client-api.arkoselabs.com,🤖 AI服务
DOMAIN-SUFFIX,featuregates.org,🤖 AI服务
DOMAIN-SUFFIX,api.statsig.com,🤖 AI服务
DOMAIN-SUFFIX,events.statsigapi.net,🤖 AI服务
DOMAIN,host.livekit.cloud,🤖 AI服务
DOMAIN,turn.livekit.cloud,🤖 AI服务
DOMAIN-SUFFIX,anthropic.com,🤖 AI服务
DOMAIN-SUFFIX,claude.ai,🤖 AI服务
DOMAIN-SUFFIX,claude.com,🤖 AI服务
DOMAIN-SUFFIX,claudeusercontent.com,🤖 AI服务
DOMAIN,gemini.google.com,🤖 AI服务
DOMAIN,aistudio.google.com,🤖 AI服务
DOMAIN,generativelanguage.googleapis.com,🤖 AI服务
DOMAIN,alkalimakersuite-pa.clients6.google.com,🤖 AI服务
DOMAIN-SUFFIX,copilot.microsoft.com,🤖 AI服务
DOMAIN-SUFFIX,perplexity.ai,🤖 AI服务
DOMAIN-SUFFIX,x.ai,🤖 AI服务
DOMAIN-SUFFIX,grok.com,🤖 AI服务
DOMAIN-SUFFIX,poe.com,🤖 AI服务
DOMAIN-SUFFIX,mistral.ai,🤖 AI服务
DOMAIN-SUFFIX,cursor.com,🤖 AI服务
DOMAIN-SUFFIX,cursor.sh,🤖 AI服务

# 电报、国际流媒体（SukkaW/Surge 规则集；不含 IP 的规则在前，IP 规则放到后面，避免提前触发 DNS 解析）
RULE-SET,https://ruleset.skk.moe/List/non_ip/telegram.conf,📲 电报消息
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream.conf,🎞️ 国际流媒体

# Loyalsoldier/surge-rules 白名单模式：未命中规则的流量走代理
# 与 Clash / sing-box 模板同源同策略，规则集每日自动更新
DOMAIN-SET,https://testingcf.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/private.txt,DIRECT
DOMAIN-SET,https://testingcf.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/reject.txt,REJECT-TINYGIF
DOMAIN-SET,https://testingcf.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/icloud.txt,DIRECT
DOMAIN-SET,https://testingcf.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/apple.txt,DIRECT
DOMAIN-SET,https://testingcf.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/google.txt,Proxy
DOMAIN-SET,https://testingcf.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/proxy.txt,Proxy
DOMAIN-SET,https://testingcf.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/direct.txt,DIRECT
RULE-SET,https://ruleset.skk.moe/List/ip/telegram.conf,📲 电报消息
RULE-SET,https://ruleset.skk.moe/List/ip/stream.conf,🎞️ 国际流媒体
RULE-SET,https://testingcf.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/cncidr.txt,DIRECT

# 局域网
RULE-SET,SYSTEM,DIRECT
RULE-SET,LAN,DIRECT

# 最终规则
GEOIP,CN,DIRECT
FINAL,🐟 漏网之鱼,dns-failed

[URL Rewrite]
^https?://(www.)?(g|google).cn https://www.google.com 302
